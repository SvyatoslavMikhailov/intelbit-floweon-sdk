[project]
name = "intelbit-river-sdk"
version = "0.1.0"
description = "SDK для разработчиков плагинов Интелбит:Река (Connector / Transformer / Notifier)"
license = { text = "Apache-2.0" }
authors = [{ name = "ООО Интелбит", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-river-sdk"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-river-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/river_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — кириллические «двойники»; проект ведёт комментарии по-русски.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
